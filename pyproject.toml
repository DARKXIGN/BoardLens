[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boardlens"
version = "0.1.0"
description = "Data generation, training and evaluation for the BoardLens far-text reading app"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.1",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=4"]
train = ["torch>=2.4", "wandb"]
# Converter formerly called AI Edge Torch. Install in a separate env if it pins torch.
export = ["litert-torch"]
dev = ["pytest>=8"]

[project.scripts]
bl-render-slides = "boardlens_data.render_slides:main"
bl-make-pairs = "boardlens_data.make_pairs:main"
bl-align = "boardlens_data.align:main"
bl-eval = "boardlens_ml.evaluate:main"
bl-train-sr = "boardlens_ml.train_sr:main"
bl-export = "boardlens_ml.export:main"

[tool.setuptools.packages.find]
where = ["data", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
